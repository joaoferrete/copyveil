name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic:
    name: Conventional Commits title
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with CONTRIBUTING.md.
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            build
            ci
            chore
            revert
          scopes: |
            core
            detect
            app
            capture
            gnome-ext
            design
            packaging
            deps
            repo
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: Start the subject in lowercase and leave out the final period.
