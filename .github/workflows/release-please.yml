name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      pr_branch: ${{ steps.rp.outputs.pr && fromJSON(steps.rp.outputs.pr).headBranchName }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          # A token other than GITHUB_TOKEN, so CI runs on the release PR.
          # See docs/maintainers/repository-settings.md.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps Cargo.toml but not Cargo.lock; refresh it on the release PR.
  sync-lockfile:
    needs: release-please
    if: needs.release-please.outputs.pr_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - run: cargo update --workspace
      - run: |
          if ! git diff --quiet Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(deps): sync Cargo.lock with release version"
            git push
          fi

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - name: Install GTK 4 and libadwaita
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - run: cargo build --workspace --release --locked
      - name: Package
        run: |
          mkdir -p dist
          tar -C target/release -czf "dist/copyveil-${{ needs.release-please.outputs.tag_name }}-x86_64-linux.tar.gz" copyveil copyveil-daemon
          # One CycloneDX SBOM per crate, written next to each Cargo.toml.
          cargo cyclonedx --format json --all-features
          find crates -name '*.cdx.json' -exec cp {} dist/ \;
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/*
        env:
          GH_TOKEN: ${{ github.token }}
