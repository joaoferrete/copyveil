name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK 4 and libadwaita
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev libadwaita-1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Architecture layers
        run: python3 tools/layers.py

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK 4 and libadwaita
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev libadwaita-1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  coverage:
    name: Coverage gate (core, detect >= 90%)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: >
          cargo llvm-cov --locked -p copyveil-core -p copyveil-detect
          --fail-under-lines 90

  # Every mutant is tested, split across four machines. The job named
  # "Mutation testing (core, detect)" is the one the branch rules require.
  mutants-shard:
    name: Mutants shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - run: >
          cargo mutants --package copyveil-core --package copyveil-detect
          --no-shuffle --shard ${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out-${{ matrix.shard }}
          path: mutants.out

  mutants:
    name: Mutation testing (core, detect)
    runs-on: ubuntu-24.04
    needs: mutants-shard
    if: always()
    steps:
      - name: Every shard passed
        run: test "${{ needs.mutants-shard.result }}" = success

  deny:
    name: Licences, advisories, sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  design-tokens:
    name: Design tokens and contrast
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/tokens.py --check

  gnome-extension:
    name: GNOME extension lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gnome-extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnome-extension/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  meson:
    name: Meson build and data validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Install Meson, validators, GTK 4 and libadwaita
        uses: ./.github/actions/apt-install
        with:
          packages: meson ninja-build desktop-file-utils appstream libgtk-4-dev libadwaita-1-dev gettext
      - run: meson setup _build -Dprofile=debug
      - run: meson compile -C _build
      - run: meson test -C _build --print-errorlogs
      - name: Translations complete and valid
        run: tools/check-translations.sh
