name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  coverage:
    name: Coverage gate (core, detect >= 90%)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: >
          cargo llvm-cov --locked -p copyveil-core -p copyveil-detect
          --ignore-filename-regex 'src/bin/'
          --fail-under-lines 90

  mutants:
    name: Mutation testing (core, detect)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - run: cargo mutants --package copyveil-core --package copyveil-detect --no-shuffle
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out
          path: mutants.out

  deny:
    name: Licences, advisories, sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  design-tokens:
    name: Design tokens and contrast
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/tokens.py --check

  gnome-extension:
    name: GNOME extension lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gnome-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnome-extension/package-lock.json
      - run: npm ci
      - run: npm run lint

  meson:
    name: Meson build and data validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends meson ninja-build desktop-file-utils appstream
      - run: meson setup _build -Dprofile=debug
      - run: meson compile -C _build
      - run: meson test -C _build --print-errorlogs
