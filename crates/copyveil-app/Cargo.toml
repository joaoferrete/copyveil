[package]
name = "copyveil-app"
description = "Copyveil GTK4/libadwaita app: popup, settings and onboarding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "copyveil"
path = "src/main.rs"

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
async-channel = "2"
copyveil-dbus.workspace = true
futures-util = { version = "0.3", default-features = false }
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
zbus = { version = "6", default-features = false, features = ["tokio"] }

[lints]
workspace = true

[dev-dependencies]
copyveil-detect.workspace = true
serde_json = "1.0.154"
