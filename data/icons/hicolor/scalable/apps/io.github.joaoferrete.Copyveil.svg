<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- The veil: a graphite cloth falling over a kraft card, leaving only its
       first line of text. Drawn on the GNOME app-icon grid (96 px square with
       a 4 px base). See docs/design/README.md. -->
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDB377"/>
      <stop offset="1" stop-color="#C69754"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A77A3"/>
      <stop offset="1" stop-color="#2C3C55"/>
    </linearGradient>
    <pattern id="hem" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="#E4E9F0"/>
      <rect width="2" height="5" fill="#6A7C98"/>
    </pattern>
    <clipPath id="square">
      <rect x="16" y="16" width="96" height="96" rx="16"/>
    </clipPath>
  </defs>
  <rect x="16" y="20" width="96" height="96" rx="16" fill="#8A6234"/>
  <rect x="16" y="16" width="96" height="96" rx="16" fill="url(#card)"/>
  <rect x="28" y="30" width="34" height="8" rx="4" fill="#FDFDFC"/>
  <rect x="28" y="44" width="20" height="8" rx="4" fill="#FDFDFC" opacity=".7"/>
  <g clip-path="url(#square)">
    <path d="M58 8 C80 10 104 8 124 6 L124 130 L8 130 C22 116 30 102 44 92 C58 82 52 64 66 54 C76 46 64 30 58 8Z" fill="url(#cloth)"/>
    <path d="M8 130 C22 116 30 102 44 92 C58 82 52 64 66 54 C76 46 64 30 58 8 L52 8 C58 30 70 46 60 54 C46 64 52 82 38 92 C24 102 16 116 2 130Z" fill="url(#hem)"/>
    <g fill="none" stroke-linecap="round" stroke-width="3">
      <path d="M82 20 C84 44 76 70 64 98 C58 110 54 118 52 124" stroke="#7690B5" opacity=".7"/>
      <path d="M100 18 C102 50 96 80 88 124" stroke="#1E2A3D" opacity=".5"/>
    </g>
  </g>
</svg>
